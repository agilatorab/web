name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Include `labeled` / `unlabeled` so the `no-changelog` escape
    # hatch re-runs the changeset job when the label is toggled after
    # the PR opened. The default activity types (`opened`,
    # `synchronize`, `reopened`) would otherwise leave the check stuck
    # red until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The sitemap's <lastmod> comes from git history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Composition analysis (OSS_SPEC §14): a high-severity advisory in the
      # dependency tree fails the build.
      - run: npm audit --audit-level=high
      - run: make fmt-check
      - run: make lint
      - run: make test
      - run: make build
      - run: make check-seo

  # The generated brand assets in public/ must match src/brand/paths.ts —
  # a hand-edited favicon or social card is drift, not design.
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make brand
      - name: Verify the committed assets are the generated ones
        # The SVGs are text and must match byte for byte. The PNGs are
        # compared by shape only: libvips encodes identically on one machine,
        # but a different build can differ in bytes while the pixels agree.
        run: |
          if ! git diff --quiet -- 'public/*.svg'; then
            echo "::error::public/*.svg differ from what \`make brand\` generates — run it and commit the result"
            git --no-pager diff --stat -- public
            exit 1
          fi
          for f in favicon-32.png apple-touch-icon.png og.png; do
            test -s "public/$f" || { echo "::error::public/$f missing"; exit 1; }
          done

  # Shell scripts and workflow YAML are infrastructure and get the same
  # zero-warning treatment as the TypeScript (OSS_SPEC §16.1).
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/local/bin
      - run: make actionlint
      - run: make shellcheck

  changeset:
    # Enforces that every PR touching user-visible code drops a
    # changelog fragment under .changes/unreleased/, or opts out via
    # the `no-changelog` label. Pure refactors, CI/build tweaks, and
    # docs-only edits pass via the skip-list inside the script.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check for changelog fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/release/check-changeset.mjs
